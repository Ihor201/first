<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Форму прийнято</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #e8f5e9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .box {
      background: white;
      padding: 40px 60px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
    }
    h2 { color: #2e7d32; }
    p  { color: #555; font-size: 1.1em; }
  </style>
</head>
<body>
  <div class="box">
    <h2>&#10003; Дякуємо!</h2>
    <p>Ваша форма прийнята до обробки. Дякуємо за увагу.</p>
    <p><a href="javascript:window.close()">Закрити вікно</a></p>
  </div>
</body>
</html>
